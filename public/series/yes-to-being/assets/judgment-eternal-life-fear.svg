<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">审判、永生与恐惧的三域判别</title>
  <desc id="desc">同一组审判与永生语言分别进入教义、心理和组织三个域，需要以内部解释、经验研究和实际果实分别判断。</desc>
  <rect width="1200" height="675" fill="#f8faf7"/>
  <g font-family="LXGW WenKai Lite, Noto Serif SC, Songti SC, serif" text-anchor="middle">
    <text x="80" y="78" text-anchor="start" fill="#25352d" font-size="42" font-weight="700">同一句话，要在三个域里分别判断</text>
    <text x="80" y="122" text-anchor="start" fill="#607069" font-size="25">教义不等于心理功能，心理功能也不等于组织控制</text>

    <rect x="385" y="158" width="430" height="72" rx="4" fill="#25352d"/>
    <text x="600" y="204" fill="#fff" font-size="29">审判 · 永生 · 回转</text>

    <path d="M600 230V278M600 278H208V310M600 278V310M600 278H992V310" fill="none" stroke="#b8c5bb" stroke-width="4"/>
    <g>
      <rect x="78" y="310" width="260" height="166" rx="4" fill="#355b4b"/>
      <text x="208" y="358" fill="#fff" font-size="30">教义域</text>
      <text x="208" y="400" fill="#fff" font-size="23">责任 · 正义 · 盼望</text>
      <text x="208" y="438" fill="#dce9e1" font-size="20">传统如何理解自己</text>

      <rect x="470" y="310" width="260" height="166" rx="4" fill="#587487"/>
      <text x="600" y="358" fill="#fff" font-size="30">心理域</text>
      <text x="600" y="400" fill="#fff" font-size="23">恐惧 · 意义 · 安全感</text>
      <text x="600" y="438" fill="#e1eaf0" font-size="20">用经验研究观察作用</text>

      <rect x="862" y="310" width="260" height="166" rx="4" fill="#b68136"/>
      <text x="992" y="358" fill="#fff" font-size="30">组织域</text>
      <text x="992" y="400" fill="#fff" font-size="23">接引 · 见证 · 控制</text>
      <text x="992" y="438" fill="#fff2db" font-size="20">看权力、行为与果实</text>
    </g>

    <path d="M208 476V530M600 476V530M992 476V530" stroke="#b8c5bb" stroke-width="3" stroke-dasharray="9 9"/>
    <rect x="170" y="530" width="860" height="78" rx="4" fill="#e8eee9" stroke="#b8c5bb" stroke-width="2"/>
    <text x="600" y="578" fill="#25352d" font-size="27">不问“它只是什么”，要问“它在哪个域里如何作用”</text>
  </g>
</svg>
