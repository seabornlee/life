<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">罪与原罪的关系失序</title>
  <desc id="desc">自我绝对化使人与上帝、他人、自我和世界的关系偏离，恩典、悔改和实践推动重新定向。</desc>
  <rect width="1200" height="675" fill="#f8faf7"/>
  <g font-family="LXGW WenKai Lite, Noto Serif SC, Songti SC, serif" text-anchor="middle">
    <text x="80" y="78" text-anchor="start" fill="#25352d" font-size="42" font-weight="700">罪不只是违规，而是中心错位</text>
    <text x="80" y="122" text-anchor="start" fill="#607069" font-size="25">有限的我占据终极位置，失序沿四组关系扩散</text>
    <circle cx="600" cy="330" r="102" fill="#9a4f49"/>
    <text x="600" y="315" fill="#fff" font-size="30">自我绝对化</text>
    <text x="600" y="356" fill="#fff" font-size="22">“我就是最终尺度”</text>
    <path d="M530 255L360 190M670 255L840 190M530 405L360 485M670 405L840 485" stroke="#b8c5bb" stroke-width="4" stroke-dasharray="10 10"/>
    <g font-size="26">
      <rect x="125" y="142" width="300" height="94" rx="4" fill="#355b4b"/>
      <text x="275" y="181" fill="#fff">人与上帝</text><text x="275" y="215" fill="#fff" font-size="20">不信任 · 偶像化</text>
      <rect x="775" y="142" width="300" height="94" rx="4" fill="#587487"/>
      <text x="925" y="181" fill="#fff">人与他人</text><text x="925" y="215" fill="#fff" font-size="20">利用 · 伤害</text>
      <rect x="125" y="444" width="300" height="94" rx="4" fill="#b68136"/>
      <text x="275" y="483" fill="#fff">人与自我</text><text x="275" y="517" fill="#fff" font-size="20">自恋 · 自我厌弃</text>
      <rect x="775" y="444" width="300" height="94" rx="4" fill="#59665f"/>
      <text x="925" y="483" fill="#fff">人与世界</text><text x="925" y="517" fill="#fff" font-size="20">掠夺 · 逃避责任</text>
    </g>
    <path d="M355 582H845" stroke="#b8c5bb" stroke-width="3"/>
    <text x="600" y="625" fill="#355b4b" font-size="25">恩典 → 承认 → 悔改 → 修复 → 重新定向</text>
  </g>
</svg>
